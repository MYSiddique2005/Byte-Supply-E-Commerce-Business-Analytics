name: Analytics pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pipeline (KPIs, charts, ML, dashboard)
        run: python scripts/run_pipeline.py
      - name: Execute notebook
        run: |
          cd notebooks
          python -m nbconvert --to notebook --execute --output /tmp/executed.ipynb Byte_Supply_Big_Data_Analytics.ipynb
